name: GCP Terraform Deployment

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: "Apply after reviewing the plan from a previous run"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: gcp-terraform-state
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform Plan / Apply
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_project_id: "project-3c584b29-0ddb-45ce-95d"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"

      - name: Authenticate to Google Cloud using Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: "project-3c584b29-0ddb-45ce-95d"
          workload_identity_provider: "projects/620317254226/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-terraform-deployer@project-3c584b29-0ddb-45ce-95d.iam.gserviceaccount.com"

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: "project-3c584b29-0ddb-45ce-95d"

      - name: Verify Google Cloud identity
        run: |
          gcloud config set project "$TF_VAR_project_id"
          gcloud auth list
          gcloud projects describe "$TF_VAR_project_id" --format="value(projectId,projectNumber)"

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        if: ${{ inputs.apply_changes }}
        run: terraform apply -auto-approve tfplan
